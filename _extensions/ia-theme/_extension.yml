name: ia-theme
title: iA Presenter-style Reveal.js Theme
author: Your Name
version: 1.0.0
quarto-required: ">=1.3.0"
contributes:
  formats:
    revealjs:
      theme: [default, ia-theme.scss]
      width: 1600
      height: 900
      margin: 0
      slide-number: false
      progress: true
      controls: false
      transition: none
      history: false
      filters:
        - color-palette.lua
